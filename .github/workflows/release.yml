name: release

# Publishes a GitHub release each time a pull request is merged into main.
# The version is the latest vX.Y.Z tag with the patch number bumped
# (v0.1.0 for the first release). Label the PR `release:minor` or
# `release:major` to bump that part instead, or `release:skip` for none.
# Release notes are generated by GitHub from the merged PRs.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'release:skip')
    runs-on: ubuntu-latest
    steps:
      - name: Pick the next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case " $LABELS " in
              *" release:major "*) next="v$((major + 1)).0.0" ;;
              *" release:minor "*) next="v$major.$((minor + 1)).0" ;;
              *)                   next="v$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "Latest tag: ${latest:-none}; next: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$TAG: $PR_TITLE" \
            --generate-notes
