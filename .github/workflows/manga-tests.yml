name: manga tests

on:
  push:
    paths: ['manga/**', 'requirements.txt', '.github/workflows/manga-tests.yml']
  pull_request:
    paths: ['manga/**', 'requirements.txt', '.github/workflows/manga-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest manga/tests -q
