# The manga engine's style defaults, as shipped.
#
# DON'T EDIT THIS FILE: `git pull` replaces it. To change a value, create manga/settings.local.toml (git ignores
# it) and copy in only the section headers and lines you want to change, for example:
#
#     [lines]
#     width_scale = 1.25        # every line a quarter heavier
#
#     [hatch]
#     spacing_mm = 0.55         # tighter hatching
#
#     [tone]
#     soft_mm = 1.5             # soft shadows: tone fades out over 1.5 mm at its edge
#
# See what is in effect with:  python -m manga
# Other ways to pick a settings file: MANGA_SETTINGS=path/to/style.toml, `--settings path/to/style.toml` on any
# script that imports manga, or manga.settings.use('style.toml') in code. A value passed in a call always wins.
# Lengths are in mm on the page, so they hold at any print scale.


# ---------------------------------------------------------------- line thickness

[lines]
width_scale = 1.0     # multiplies the width of every pen (1.2 = all lines 20 % heavier)
taper_scale = 1.0     # multiplies every pen's entry/exit taper (0 = blunt ends, 2 = long thin tails)
wobble_scale = 1.0    # multiplies hand tremor (0 = ruler-steady lines)

# One table per pen. Width in mm: min_mm at zero pressure, max_mm at full pressure,
#   width = min_mm + (max_mm - min_mm) * pressure ** gamma   (gamma > 1: needs a firm hand to open the nib).
# rough = ragged edge, dry = how soon a brush runs dry, ink = opacity. Add a [pens.<new_name>] table to make a pen
# of your own (it needs at least min_mm and max_mm) and use it by name: pen='<new_name>'.

[pens.g_pen]          # the main manga nib: thin at rest, flares under pressure. Outlines.
min_mm = 0.06
max_mm = 0.85
gamma = 1.7
taper_in_mm = 1.2
taper_out_mm = 3.0
wobble_mm = 0.02

[pens.saji]           # spoon pen: steadier, moderate swell. Clothes and backgrounds.
min_mm = 0.08
max_mm = 0.45
gamma = 1.3
taper_in_mm = 0.8
taper_out_mm = 2.0
wobble_mm = 0.015

[pens.maru]           # round pen: hairline. Faces, hatching, fine detail.
min_mm = 0.03
max_mm = 0.22
gamma = 1.2
taper_in_mm = 0.6
taper_out_mm = 1.6
wobble_mm = 0.01

[pens.brush]          # brush pen: big swell, rough edges, runs dry at the tail.
min_mm = 0.15
max_mm = 4.0
gamma = 1.4
taper_in_mm = 2.0
taper_out_mm = 6.0
wobble_mm = 0.05
rough = 0.06
dry = 0.35

[pens.fineliner]      # constant width, square ends. Rulers, buildings.
min_mm = 0.30
max_mm = 0.30
taper_in_mm = 0.0
taper_out_mm = 0.0
wobble_mm = 0.0

[pens.border]
min_mm = 0.8
max_mm = 0.8
taper_in_mm = 0.0
taper_out_mm = 0.0
wobble_mm = 0.0

[pens.marker]         # flat fills and heavy shapes
min_mm = 1.2
max_mm = 1.2
taper_in_mm = 0.0
taper_out_mm = 0.0
wobble_mm = 0.03

[pens.white]          # white-out brush (mode='white')
min_mm = 0.2
max_mm = 1.6
gamma = 1.2
taper_in_mm = 0.8
taper_out_mm = 1.5
wobble_mm = 0.02



# ---------------------------------------------------------------- humanize: a hand draws the lines (manga/humanize)

[humanize]                # OFF by default: with it off every page is exactly what it was
enabled = false           # true = every sheet's strokes are drawn by a hand (or call sh.humanize() on one sheet)
strength = 0.15           # 0 = off, 0.15 = a quiet hand, 0.3 = the whole shape of a line is the hand's
person = 1                # which hand: the same number is the same artist on every page (try 2, 3, ...)
# seed = 7                # this sitting's chance; unset = the sheet's own seed
max_drift_mm = 2.0        # a line moves at most this x strength from where it was planned (0.3 mm at 0.15)
ruled = 0.0               # share for straight blunt-ended lines (panel rules): 0 = they stay ruler-straight

[humanize.parts]          # share of the strength per part, named in code with `with sh.part('eyes'):`
eyes = 0.25               # eyes first: the gentlest hand
face = 0.5
hair = 0.8
body = 1.0
background = 1.0
effects = 0.3             # speed, focus and flash lines

[humanize.interest]       # how much the hand cares about a part: 1 = slow and collected, 0 = loose and quick
eyes = 1.0
face = 0.85
hair = 0.65
body = 0.5
background = 0.25
effects = 0.35

[humanize.pens]           # share of the strength per pen (pens not listed: 1)
fineliner = 0.0           # rulers and templates
border = 0.0
marker = 0.5

# ---------------------------------------------------------------- figure outlines: prep.ink_outline()

[prep.ink_outline]
pen = "g_pen"
pressure = [0.35, 0.85]   # lit side .. shadow side: raise both for heavier outlines, widen for more contrast
light = [-1.0, -1.0]      # direction the light comes from (x, y; y down): the far side gets the heavy line
max_seg_mm = 40.0         # longest single stroke before the outline is broken into overlapping strokes


# ---------------------------------------------------------------- line art traced from a reference

[trace.ink_line_art]      # turns a traced line mask into pen strokes
pens = ["maru", "g_pen"]  # [thin pen, thick pen]
split_mm = 0.25           # lines narrower than this get the thin pen
weight = 1.3              # line weight relative to the traced width: the main "heavy vs delicate" knob
min_px = 1.3              # thinnest line drawn (px)
even = 0.0                # 0..1: how far each line keeps one steady weight instead of swelling where lines meet
beta_px = 3.0             # parts of the mask thicker than twice this become solid black areas, not lines
min_len_px = 4.0          # shorter scraps are dropped
tol = 0.6                 # path simplification (px): bigger = smoother, less faithful lines

[prep.xdog_lines]         # how much of a reference becomes line (an edge finder; a guide, not the drawing)
sigma = 1.2               # edge scale (px): bigger = only broad edges, fewer fine lines
k = 1.6
p = 20.0                  # edge strength: bigger = more, darker lines
eps = -0.02               # threshold: lower = fewer lines, only the strongest edges
phi = 60.0                # edge sharpness
tidy = 8                  # specks smaller than this (px) are removed

[prep.darkness]           # how a reference's colours read as darkness before tone and hatching use them
blur = 1.5
gamma = 1.0               # above 1 = mid-tones read lighter (only real shadows go dark); below 1 = darker
lo = 0.0                  # darkness at or below this reads as paper
hi = 1.0                  # darkness at or above this reads as black
mode = "lightness"        # "value" makes saturated colours read as mid-tones the way an inker sees them
mix = 0.5                 # share of value in "value" mode


# ---------------------------------------------------------------- faces: eyes first (sizes in px unless noted)

[face.manga_iris]
solid = 0.26              # the iris is solid black from the lid down to this share of its height
peak = 0.7                # the tone below the black starts at this level...
fade = 0.66               # ...and fades to paper by this share of the height
pupil_r = 0.13            # pupil radius, share of the iris width
sparkles = 3              # small sparkle dots low in the iris
rim = 0.65                # rim line weight (pressure; 0 = no rim)
lpi = 60

[face.eye_white]
depth = 7.0               # height of the upper lid's shadow on the white
level = 0.26              # its tone level
lpi = 70

[face.brow_stroke]        # a brow as one thick-to-thin stroke
tail_w = 4.0              # width at the thin tail
min_w = 1.5               # the stroke never gets thinner than this
reach = 200               # how far it may follow the reference's thin tail
tip_len = 9

[face.closed_eye]         # sizes in reference px
sag = 8.0                 # how far the lid bows down
thick = [1.0, 4.6]        # lid line width, inner corner .. outer corner
lashes = 3
lash_len = 10.0
crease = 9.0              # height of the crease line above the lid
widen = 4.0

[face.blush]              # slanted hatch strokes on the cheek
n = 7                     # number of strokes (more = deeper flush)
slant = -62.0             # stroke angle, degrees
pen = "maru"
pressure = 0.32
length = 0.75             # stroke length, share of the blush ellipse
soft = false              # true = strokes fade at both ends

[face.blush_tone]         # a tone band on the cheek with no outline
peak = 0.24               # tone level at its centre
soft_px = 14              # width of the fade at its edge
lpi = 60


# ---------------------------------------------------------------- hatching: hatch()

[hatch]
pen = "maru"
angle = 45.0              # direction of the first layer, degrees (0 = horizontal, 90 = vertical)
spacing_mm = 0.7          # gap between lines: smaller = denser, darker hatching
# [darkness threshold, extra angle] per layer: a layer is drawn only where the tone is darker than its
# threshold. One layer = plain hatching; two or three = cross-hatching.
layers = [[0.2, 0.0], [0.45, 90.0], [0.7, 45.0]]
pressure = [0.25, 0.85]   # line weight in light .. dark parts
stroke_mm = [5.0, 11.0]   # length of one hand stroke (long runs are broken into these)
min_mm = 1.2              # shortest stroke laid
jitter = 0.12             # spacing irregularity (share of spacing_mm)
angle_jitter = 1.2        # direction irregularity, degrees
bow = 0.15                # how much each stroke arcs, like a wrist


# ---------------------------------------------------------------- screentone and shadows: tone()

[tone]
lpi = 42.0                # screen ruling, lines per inch (bigger = finer dots). Print pages: 50-65.
angle = 45.0              # screen angle, degrees
kind = "dot"              # "dot", "line" or "noise"
grain_mm = 0.12           # grain size of "noise" tone
soft_mm = 0.0             # HARD vs SOFT shadows. 0 = hard, knife-cut tone edges (classic manga). Above 0,
                          # tone fades out toward its edge over this many mm (soft, airbrushed shadows).

[trace.area_tones]        # how a traced picture is split into flat tone areas
shade = 0.14              # how much darker than its area a part must be to get the next (shadow) tone
light = 0.16              # how much lighter than its area a part must be to be scraped to paper (highlight)
min_area = 25             # areas smaller than this (px) take the tone of their own darkness
blur = 1.5                # smoothing before the split: bigger = simpler, blockier shadow shapes
# the tone palette: [up to this darkness, use this tone level]; add, remove or move steps for your own set
stock = [[0.1, 0.0], [0.26, 0.12], [0.42, 0.25], [0.58, 0.4], [0.74, 0.55], [0.86, 0.72], [2.0, 1.0]]


# ---------------------------------------------------------------- panels and paper

[effects.border]
width_mm = 0.8            # panel border line

[effects.layout]
margin_mm = 10.0          # page margin
gutter_mm = [3.0, 6.0]    # gap between panels: [between columns, between rows]

[effects.focus_lines]     # concentrated lines toward a point
count = 220
pen = "g_pen"
pressure = [0.55, 1.0]
reach = 0.35              # how ragged the inner ends are
bundles = true            # strokes grouped in bundles, with gaps between

[effects.speed_lines]
count = 90
pen = "maru"
pressure = [0.4, 0.9]
length = [0.3, 0.9]       # share of the box
fade = "both"             # taper at "both" ends, the "start" or the "end"

[effects.flash]           # radial flash lines
count = 160
pen = "maru"
pressure = [0.4, 0.9]

[effects.caption]         # narration boxes and lettering
size_mm = 3.6             # letter size
pad_mm = 1.6              # padding inside the box
box = true
bold = true
# face = "dialogue"       # "dialogue" or "caption" (bundled Comic Neue), or a path to a .ttf; unset = system sans

[effects.halo]
width_mm = 1.2            # white gap cut round a figure on a toned background

[sheet]
paper = [247, 245, 239]   # paper colour (RGB)
ink = [18, 17, 20]        # ink colour (RGB)
